name: Sync legacy MUSHIN Glass path

on:
  push:
    paths:
      - '.github/workflows/sync-mushin-legacy-path.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep legacy path identical to current source
        run: |
          cp mushin-glass.gradle design-system/mushin-glass.gradle
          rm .github/workflows/sync-mushin-legacy-path.yml
      - name: Commit compatibility alias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system/mushin-glass.gradle .github/workflows/sync-mushin-legacy-path.yml
          git commit -m "Keep legacy MUSHIN Glass path in sync"
          git push
