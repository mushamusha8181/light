name: One-off flashlight settings MUSHIN patch

on:
  push:
    paths:
      - 'MUSHIN_LIGHT_SETTINGS_TRIGGER'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Style dynamic settings controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/jp/mushamusha/threelevelflashlight/MainActivity.java')
          s=p.read_text()
          anchor='import android.widget.Toast;\n'
          if 'import jp.mushamusha.mushinglass.MushinGlass;' not in s:
              s=s.replace(anchor,anchor+'\nimport jp.mushamusha.mushinglass.MushinGlass;\n',1)
          anchor='''        ScrollView settingsScroll = new ScrollView(this);\n        settingsScroll.setFillViewport(false);\n        settingsScroll.addView(box);'''
          if anchor not in s: raise SystemExit('settings anchor missing')
          s=s.replace(anchor,'''        MushinGlass.applyToView(this, box);\n        ScrollView settingsScroll = new ScrollView(this);\n        settingsScroll.setFillViewport(false);\n        settingsScroll.addView(box);''',1)
          p.write_text(s)
          PY
          rm -f MUSHIN_LIGHT_SETTINGS_TRIGGER .github/workflows/oneoff-light-settings-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply MUSHIN settings to flashlight dialog'
          git push
