name: Fix MUSHIN generated manifest lifecycle

on:
  push:
    paths:
      - '.github/workflows/fix-mushin-generated-manifest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate manifest inside prepare task
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mushin-glass.gradle')
          s=p.read_text(encoding='utf-8')
          old="""def prepareMushinGlass = tasks.register('prepareMushinGlass') {
    doLast {
        def src = new File(mgGenerated, 'src/jp/mushamusha/mushinglass/MushinGlass.java')
"""
          new="""def prepareMushinGlass = tasks.register('prepareMushinGlass') {
    doLast {
        mgGeneratedManifest.parentFile.mkdirs()
        mgGeneratedManifest.setText(mgManifestText, 'UTF-8')
        def src = new File(mgGenerated, 'src/jp/mushamusha/mushinglass/MushinGlass.java')
"""
          if old not in s:
              raise SystemExit('prepareMushinGlass anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('design-system/mushin-glass.gradle').write_text(p.read_text(encoding='utf-8'),encoding='utf-8')
          PY
          rm .github/workflows/fix-mushin-generated-manifest.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mushin-glass.gradle design-system/mushin-glass.gradle .github/workflows/fix-mushin-generated-manifest.yml
          git commit -m "Regenerate MUSHIN manifest after clean builds"
          git push
