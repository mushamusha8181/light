name: Fix MUSHIN icon default

on:
  push:
    paths:
      - '.github/workflows/fix-mushin-icon-default.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align default icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java = Path('app/src/main/java/jp/mushamusha/mushinglass/MushinGlass.java')
          s = java.read_text(encoding='utf-8')
          s = s.replace('icon("default","標準（赤）","#E62117","IconDefault")', 'icon("default","標準（モスグリーン）","#436E6A","IconDefault")')
          java.write_text(s, encoding='utf-8')

          for path in [Path('mushin-glass.gradle'), Path('design-system/mushin-glass.gradle')]:
              if not path.exists():
                  continue
              t = path.read_text(encoding='utf-8')
              t = t.replace("[default:'#E62117',green:'#4E8F6B'", "[default:'#436E6A',green:'#4E8F6B'")
              path.write_text(t, encoding='utf-8')
          PY
          rm .github/workflows/fix-mushin-icon-default.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use moss green as MUSHIN default icon"
          git push
