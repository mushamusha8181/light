name: One-off MUSHIN view ID normalization

on:
  push:
    paths:
      - 'MUSHIN_UI_ID_TRIGGER'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize view IDs before MUSHIN matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/jp/mushamusha/mushinglass/MushinGlass.java')
          s=p.read_text()
          old='''        boolean glass=simple.contains("CardView")||simple.contains("Toolbar")||simple.contains("BottomNavigation")||simple.contains("NavigationBar")||simple.contains("AppBar")||id.contains("card")||id.contains("panel")||id.contains("toolbar")||id.contains("bottom_bar")||id.contains("bottom_nav")||id.contains("top_bar")||id.contains("controls")||id.contains("search_box")||id.contains("settings_section");'''
          new='''        String key=id.toLowerCase(java.util.Locale.ROOT);\n        boolean glass=simple.contains("CardView")||simple.contains("Toolbar")||simple.contains("BottomNavigation")||simple.contains("NavigationBar")||simple.contains("AppBar")||key.contains("card")||key.contains("panel")||key.contains("toolbar")||key.contains("bottom_bar")||key.contains("bottomnav")||key.contains("bottom_nav")||key.contains("top_bar")||key.contains("controls")||key.contains("searchbox")||key.contains("search_box")||key.contains("settingssection")||key.contains("settings_section");'''
          if old not in s: raise SystemExit('glass match anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f MUSHIN_UI_ID_TRIGGER .github/workflows/oneoff-ui-id-normalization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize dynamic view IDs for MUSHIN styling'
          git push
